name: Verify CRP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Check desktop and mobile in Chromium and WebKit
        run: |
          node scripts/seed.mjs
          npm run dev > /tmp/crp-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:5185/ > /dev/null
          curl --silent http://127.0.0.1:5185/api/state > /dev/null
          node scripts/seed-local.mjs
          npm run test:ui
          CRP_URL=http://127.0.0.1:5185 npm run smoke
